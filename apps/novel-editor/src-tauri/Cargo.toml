[package]
name = "kohon"
version = "0.3.3"
description = "KOHON — local-first Japanese novel writing environment"
authors = ["KOHON contributors"]
license = "Apache-2.0"
repository = "https://github.com/Hum1Tab/kohon"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "kohon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = "2.3.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native", "apple-native"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
